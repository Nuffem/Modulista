<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Modulista</title>
  <script>
    tailwind = window.tailwind || {};
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
  <div id="app" class="h-full">
    <div id="pickerView" class="h-full flex items-center justify-center">
      <div class="text-center p-6 bg-white rounded shadow dark:bg-slate-800">
        <h1 class="text-2xl font-semibold mb-4">Modulista</h1>
        <p class="mb-4">Permita o acesso a uma pasta para começar.</p>
        <button id="openBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Abrir pasta</button>
      </div>
    </div>

    <div id="mainView" class="hidden h-full flex flex-col">
      <header class="flex items-center justify-between px-4 py-2 bg-white dark:bg-slate-800 border-b dark:border-slate-700">
        <div class="flex items-center gap-3">
          <img src="modulista.svg" alt="Modulista" width="32" height="32" class="h-8 w-8 object-contain" />
          <h2 class="text-lg font-semibold">Modulista</h2>
        </div>
        <div>
          <button id="closeFolderBtn" class="p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-700" title="Fechar pasta">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-slate-600">
              <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="flex flex-1 overflow-hidden">
        <aside id="treePane" class="w-1/4 min-w-[220px] border-r bg-white dark:bg-slate-800 dark:border-slate-700 overflow-auto p-3">
          <h3 class="text-sm font-medium mb-2">Árvore</h3>
          <div id="treeContainer" class="text-sm"></div>
        </aside>

        <main id="contentPane" class="flex-1 overflow-auto p-4">
          <div id="contentHeader" class="mb-4">
            <h3 id="contentTitle" class="text-base font-medium">Conteúdo</h3>
          </div>
          <div id="contentArea" class="bg-white rounded shadow p-3 min-h-[200px] dark:bg-slate-800"></div>
        </main>

        <aside id="commandsPane" class="w-64 min-w-[200px] border-l bg-white dark:bg-slate-800 dark:border-slate-700 p-4">
          <h3 class="text-sm font-medium mb-2">Comandos</h3>
          <div id="commands" class="space-y-2">
            <button id="renameBtn" class="w-full px-3 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">Renomear</button>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script type="module" src="modulista-main.js" defer></script>
</body>
</html>
