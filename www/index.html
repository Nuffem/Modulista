<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Modulista</title>
  <script>
    tailwind = window.tailwind || {};
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .resizer { width: 8px; cursor: col-resize; touch-action: none; }
    .resizer:hover { background-color: rgba(2,6,23,0.04); }
  </style>
  <!-- Ícones do Google: https://fonts.google.com/icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="icon" href="favicon.ico" />
  <link rel="icon" href="modulista.svg" type="image/svg+xml" />
</head>
<body class="h-screen bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
  <div id="app" class="h-full">
    <div id="pickerView" class="h-full flex items-center justify-center">
      <div class="text-center p-6 bg-white rounded shadow dark:bg-slate-800">
        <h1 class="text-2xl font-semibold mb-4">Modulista</h1>
        <p class="mb-4">Permita o acesso a uma pasta para começar.</p>
            <button id="openBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
              <span class="material-symbols-outlined align-middle mr-2">folder_open</span>
              Abrir pasta
            </button>
      </div>
    </div>

    <div id="mainView" class="hidden h-full flex flex-col">
      <header class="flex items-center justify-between px-4 py-2 bg-white dark:bg-slate-800 border-b dark:border-slate-700">
        <div class="flex items-center gap-3">
          <img src="modulista.svg" alt="Modulista" width="32" height="32" class="h-8 w-8 object-contain" />
          <h2 class="text-lg font-semibold">Modulista</h2>
        </div>
        <div>
          <button id="closeFolderBtn" class="p-2 rounded hover:bg-slate-100 dark:hover:bg-slate-700" title="Gerenciar pasta">
            <span class="material-symbols-outlined text-slate-600 text-[20px]">more_vert</span>
          </button>
        </div>
      </header>

      <div class="flex flex-1 overflow-hidden" id="splitContainer">
        <aside id="treePane" class="w-1/4 min-w-[220px] border-r bg-white dark:bg-slate-800 dark:border-slate-700 overflow-auto p-3" style="flex: none;">
          <h3 class="text-sm font-medium mb-2">Árvore</h3>
          <div id="treeContainer" class="text-sm"></div>
        </aside>

        <div id="resizerLeft" class="resizer" role="separator" aria-orientation="vertical" tabindex="0"></div>

        <main id="contentPane" class="flex-1 overflow-auto p-4">
          <div id="contentHeader" class="mb-4">
            <h3 id="contentTitle" class="text-base font-medium">Conteúdo</h3>
          </div>
          <div id="contentArea" class="bg-white rounded shadow p-3 min-h-[200px] dark:bg-slate-800"></div>
        </main>

        <div id="resizerRight" class="resizer" role="separator" aria-orientation="vertical" tabindex="0"></div>

        <aside id="commandsPane" class="w-64 min-w-[200px] border-l bg-white dark:bg-slate-800 dark:border-slate-700 p-4 h-full flex flex-col" style="flex: none; min-height: 0;">
          <h3 class="text-sm font-medium mb-2">Comandos</h3>
          <div id="commands" class="space-y-2 overflow-auto flex-1 min-h-0">
            <button id="renameBtn" class="w-full flex items-center justify-start gap-2 px-3 py-2 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-100 dark:border-slate-600 border bg-indigo-600 text-white rounded hover:bg-indigo-700">
              <span class="material-symbols-outlined">edit</span>
              Renomear
            </button>
            <button id="moveExistingBtn" class="w-full flex items-center justify-start gap-2 px-3 py-2 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-100 dark:border-slate-600 border bg-indigo-600 text-white rounded hover:bg-indigo-700">
              <span class="material-symbols-outlined">folder</span>
              Mover para subpasta existente
            </button>
            <button id="moveNewBtn" class="w-full flex items-center justify-start gap-2 px-3 py-2 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-100 dark:border-slate-600 border bg-indigo-600 text-white rounded hover:bg-indigo-700">
              <span class="material-symbols-outlined">create_new_folder</span>
              Mover para nova subpasta
            </button>
            <button id="moveUpBtn" class="w-full flex items-center justify-start gap-2 px-3 py-2 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-100 dark:border-slate-600 border bg-indigo-600 text-white rounded hover:bg-indigo-700">
              <span class="material-symbols-outlined">arrow_upward</span>
              Mover para um nível acima
            </button>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Modal para restauração de pasta anterior -->
  <div id="restoreModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-slate-800 rounded shadow p-6 w-full max-w-md">
      <h4 class="text-lg font-semibold mb-2">Pasta anterior encontrada</h4>
      <p class="mb-4">Há uma pasta usada na sessão anterior. Deseja reabrir essa pasta ou escolher uma nova?</p>
      <div class="flex justify-end gap-2">
        <button id="openNewBtn" class="px-3 py-2 bg-slate-200 rounded hover:bg-slate-300">Abrir nova</button>
        <button id="restoreBtn" class="px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Reabrir pasta anterior</button>
      </div>
    </div>
  </div>

  <!-- Modal para gerenciar/fechar pasta (inclui carregamento do modelo IA) -->
  <div id="closeFolderModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-slate-800 rounded shadow p-6 w-full max-w-md">
      <div class="flex items-start justify-between mb-3">
        <h4 class="text-lg font-semibold">Gerenciar pasta</h4>
        <button id="closeModalCloseBtn" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-700">✕</button>
      </div>
      <p class="mb-4">Opções de pasta e status do modelo de IA.</p>

      <div id="modelLoadCard" class="mb-4">
        <!-- Conteúdo do card de carregamento do modelo será inserido via JS -->
      </div>

      <div class="flex justify-end gap-2">
        <button id="closeModalOpenNewBtn" class="px-3 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Abrir outra</button>
        <button id="closeModalConfirmBtn" class="px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700">Fechar pasta</button>
      </div>
    </div>
  </div>

  <script type="module" src="modulista-main.js" defer></script>
</body>
</html>
